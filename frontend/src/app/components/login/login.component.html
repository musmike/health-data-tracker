<div class="container auth-container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header bg-primary text-white">Logowanie</div>
        <div class="card-body">
          
          <div *ngIf="errorMessage" class="alert alert-danger">
            {{ errorMessage }}
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit(); $event.preventDefault()">
            <div class="mb-3">
              <label class="form-label">Login</label>
              <input type="text" class="form-control" formControlName="username">
            </div>
            <div class="mb-3">
              <label class="form-label">Hasło</label>
              <input type="password" class="form-control" formControlName="password">
            </div>
            <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">Zaloguj</button>
          </form>
          
          <div class="mt-3 text-center">
            Nie masz konta? <a routerLink="/register">Zarejestruj się</a>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
